name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTFOLIO_UI_ARTIFACT_DIR: artifacts/chromium
      PORTFOLIO_AUDIT_DIR: artifacts/webkit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: sudo apt-get install -y ffmpeg
      - run: pnpm check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-contracts
          path: artifacts
          if-no-files-found: ignore
          retention-days: 14
