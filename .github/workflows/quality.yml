name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: node scripts/check-project.mjs --scope=static

  browser-contracts:
    name: browser-contracts (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - webkit
    env:
      PORTFOLIO_UI_ARTIFACT_DIR: artifacts/chromium
      PORTFOLIO_AUDIT_DIR: artifacts/webkit
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright ${{ matrix.browser }}
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright ${{ matrix.browser }}
        id: playwright-install
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: node scripts/check-project.mjs --scope=${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-contracts-${{ matrix.browser }}
          path: artifacts/${{ matrix.browser }}
          if-no-files-found: ignore
          retention-days: 14
      - name: Save Playwright ${{ matrix.browser }}
        if: >-
          always()
          && steps.playwright-install.outcome == 'success'
          && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
