name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select checks from the complete unpublished diff
        id: scope
        env:
          SCOPE_BASE: ${{ github.event.pull_request.base.sha || 'origin/gh-pages' }}
        run: node scripts/release-scope.mjs --base "$SCOPE_BASE" --target HEAD
      - name: Install FFmpeg
        if: steps.scope.outputs.mode == 'full'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: node scripts/check-project.mjs --scope=${{ steps.scope.outputs.mode == 'copy' && 'copy' || 'static' }}

  browser-contracts:
    name: browser-contracts (${{ matrix.artifact }})
    needs: static-contracts
    if: needs.static-contracts.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            suite: all
            artifact: chromium
            scenario: ""
          - browser: webkit
            suite: core
            artifact: webkit-390-light
            scenario: 390x844-light
          - browser: webkit
            suite: core
            artifact: webkit-390-dark
            scenario: 390x844-dark
          - browser: webkit
            suite: core
            artifact: webkit-320-light
            scenario: 320x568-light
          - browser: webkit
            suite: core
            artifact: webkit-320-dark
            scenario: 320x568-dark
          - browser: webkit
            suite: components
            artifact: webkit-components
            scenario: ""
    env:
      PORTFOLIO_UI_ARTIFACT_DIR: artifacts/${{ matrix.artifact }}
      PORTFOLIO_AUDIT_DIR: artifacts/${{ matrix.artifact }}
      PORTFOLIO_WEBKIT_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright ${{ matrix.browser }}
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright ${{ matrix.browser }}
        id: playwright-install
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: node scripts/check-project.mjs --scope=${{ matrix.browser }} --browser-suite=${{ matrix.suite }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-contracts-${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}
          if-no-files-found: ignore
          retention-days: 14
      - name: Save Playwright ${{ matrix.browser }}
        if: >-
          always()
          && steps.playwright-install.outcome == 'success'
          && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

  webkit-contracts:
    name: browser-contracts (webkit)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [static-contracts, browser-contracts]
    if: always()
    steps:
      - name: Require the selected checks
        env:
          SCOPE: ${{ needs.static-contracts.outputs.mode }}
          STATIC_RESULT: ${{ needs.static-contracts.result }}
          BROWSER_RESULT: ${{ needs.browser-contracts.result }}
        run: |
          test "$STATIC_RESULT" = success
          case "$SCOPE" in
            copy) test "$BROWSER_RESULT" = skipped ;;
            full) test "$BROWSER_RESULT" = success ;;
            *) exit 1 ;;
          esac
