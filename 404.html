<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Точка не найдена — Антон Гороховатский</title>
    <meta
      name="description"
      content="Такого адреса на карте опыта Антона Гороховатского нет. Вернитесь на карту работ и интересов."
    >
    <meta name="author" content="Антон Гороховатский">
    <meta name="robots" content="noindex, follow">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#eeede7">
    <link rel="icon" href="/assets/favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180">
    <script>
      (() => {
        let savedThemeMode = null;

        try {
          savedThemeMode = window.localStorage.getItem("anton-signal-theme");
        } catch {
          savedThemeMode = null;
        }

        const themeMode = savedThemeMode === "light" || savedThemeMode === "dark"
          ? savedThemeMode
          : "system";
        const theme = themeMode === "system"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : themeMode;

        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themeMode = themeMode;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          theme === "dark" ? "#11120f" : "#eeede7",
        );
      })();
    </script>
    <link rel="preload" href="/assets/fonts/Akt-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/styles.css?v=0504835fb4af">
    <style>
      html, body { min-height: 100%; }
      body { height: auto; overflow-y: auto; }
      .not-found {
        position: relative;
        isolation: isolate;
        display: flex;
        align-items: center;
        height: auto;
        min-height: 100svh;
        overflow: hidden;
        padding: clamp(24px, 8vw, 144px);
      }
      .not-found__map {
        position: absolute;
        z-index: -1;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 12.5vw 12.5vw;
        mask-image: radial-gradient(ellipse at 75% 50%, #000, transparent 80%);
      }
      .not-found__terrain {
        position: absolute;
        z-index: -1;
        top: 50%;
        right: -8%;
        width: min(88vw, 1260px);
        height: min(90svh, 800px);
        transform: translateY(-50%);
        pointer-events: none;
        color: var(--signal);
        opacity: .55;
        mask-image: radial-gradient(ellipse at 65% 48%, #000 16%, transparent 70%);
      }
      .not-found__terrain::before {
        content: "";
        position: absolute;
        inset: 0;
        background: currentColor;
        mask: url("/assets/atlas-terrain.svg") center / cover no-repeat;
      }
      .not-found__card {
        position: relative;
        width: min(100%, 30rem);
        padding: clamp(24px, 3vw, 32px);
        border-radius: 30px;
        corner-shape: var(--corner-card-shape);
        color: var(--content-ink);
      }
      .not-found__meta {
        margin: 0 0 1.5rem;
        color: var(--content-muted);
        font-size: var(--content-type-micro);
        font-weight: 500;
        letter-spacing: .04em;
        line-height: 1.4;
        text-transform: uppercase;
      }
      .not-found__title {
        margin: 0;
        font-size: clamp(1.5rem, calc(1.25rem + 1vw), 2.25rem);
        font-weight: 500;
        line-height: 1.08;
        letter-spacing: -.025em;
        text-wrap: balance;
      }
      .not-found__copy {
        max-width: 26rem;
        margin: 1rem 0 0;
        color: var(--content-muted);
        font-size: .9375rem;
        line-height: 1.5;
        text-wrap: pretty;
      }
      .not-found__actions { margin-top: 1.5rem; }
      .not-found__action { display: inline-flex; align-items: center; min-height: 44px; font-size: .9375rem; }
      .not-found__motion {
        position: absolute;
        top: 1rem;
        right: max(12px, 2vw);
        min-height: 44px;
        max-width: calc(100% - 24px);
        font-size: .75rem;
        color: var(--content-muted);
      }
      .not-found__motion[hidden] { display: none; }
      @media (max-width: 680px) {
        .not-found { padding: 5.5rem 12px 2rem; }
        .not-found__terrain { right: -70%; width: 160%; height: 90%; }
        .not-found__card { padding: 24px; border-radius: 24px; }
      }
      @media (forced-colors: active), (prefers-contrast: more) {
        .not-found__terrain, .not-found__map { display: none; }
      }
    </style>
  </head>
  <body>
    <main class="not-found" id="content">
      <div class="not-found__map" aria-hidden="true"></div>
      <div class="not-found__terrain" aria-hidden="true"></div>

      <section
        class="not-found__card"
        data-material-surface="page-404"
        data-material-active="always"
        aria-labelledby="not-found-title"
      >
        <p class="not-found__meta">404 / Неизвестный участок</p>
        <h1 class="not-found__title" id="not-found-title">Точка не&nbsp;найдена</h1>
        <p class="not-found__copy">
          Такого адреса на&nbsp;карте нет. Возможно, ссылка устарела
          или в&nbsp;ней опечатка.
        </p>
        <nav class="not-found__actions" aria-label="Дальнейшее действие">
          <a class="not-found__action text-link" href="/#map">
            <span>Вернуться на&nbsp;карту</span>
          </a>
        </nav>
      </section>
      <button class="not-found__motion text-link" type="button" data-terrain-motion hidden>Остановить движение</button>
    </main>
    <script>
      (() => {
        const root = document.documentElement;
        const button = document.querySelector('[data-terrain-motion]');
        const system = matchMedia('(prefers-reduced-motion: reduce)');
        let paused = false;
        try { paused = localStorage.getItem('anton-signal-reduced-motion') === '1'; } catch {}
        const sync = () => {
          root.dataset.reduceMotion = String(paused || system.matches);
          button.hidden = system.matches;
          button.textContent = paused ? 'Включить движение' : 'Остановить движение';
        };
        button.addEventListener('click', () => {
          paused = !paused;
          try { localStorage.setItem('anton-signal-reduced-motion', paused ? '1' : '0'); } catch {}
          sync();
        });
        system.addEventListener('change', sync);
        document.addEventListener('visibilitychange', sync);
        sync();
      })();
    </script>
    <script type="module" src="/js/atlas-motion.js?v=06ea7b7c7898"></script>
  </body>
</html>
