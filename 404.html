    <script>
      (() => {
        let savedThemeMode = null;

        try {
          savedThemeMode = window.localStorage.getItem("anton-signal-theme");
        } catch {
          savedThemeMode = null;
        }

        const themeMode = savedThemeMode === "light" || savedThemeMode === "dark"
          ? savedThemeMode
          : "system";
        const theme = themeMode === "system"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : themeMode;

        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themeMode = themeMode;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          theme === "dark" ? "#11120f" : "#eeede7",
        );
      })();
    </script>

      .not-found {
        position: relative;
        isolation: isolate;
        display: flex;
        align-items: center;
        height: auto;
        min-height: 100svh;
        overflow: hidden;
        padding: clamp(24px, 8vw, 144px);
      }
      .not-found__map {
        position: absolute;
        z-index: -1;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(var(--line) 1px, transparent 1px),

        background-size: 12.5vw 12.5vw;
        mask-image: radial-gradient(ellipse at 75% 50%, #000, transparent 80%);
      }
      .not-found__terrain {
        position: absolute;
        z-index: -1;
        top: 50%;
        right: -8%;
        width: min(88vw, 1260px);
        height: min(90svh, 800px);
        transform: translateY(-50%);
        pointer-events: none;
        color: var(--signal);
        opacity: .55;
        mask-image: radial-gradient(ellipse at 65% 48%, #000 16%, transparent 70%);
      }
      .not-found__terrain::before {
        content: "";
        position: absolute;
        inset: 0;
        background: currentColor;
        mask: url("/assets/atlas-terrain.svg") center / cover no-repeat;
      }
      .not-found__card {
        position: relative;
        width: min(100%, 30rem);
        padding: var(--window-pad);
        border-radius: var(--window-radius);
        corner-shape: var(--corner-card-shape);
        color: var(--content-ink);
      }
      .not-found__meta {
        margin: 0 0 1.5rem;
        color: var(--content-muted);
        font-size: var(--type-label);
        font-weight: 500;
        letter-spacing: .04em;
        line-height: 1.4;
        text-transform: uppercase;
      }
      .not-found__title {
        margin: 0;
        font-size: var(--type-title);
        font-weight: 600;
        overflow-wrap: anywhere;
        line-height: var(--leading-title);
        letter-spacing: -.025em;
        text-wrap: balance;
      }
      .not-found__copy {
        max-width: 26rem;
        margin: 1rem 0 0;
        color: var(--content-muted);
        font-size: var(--type-body);
        line-height: 1.5;
        text-wrap: pretty;
      }
      .not-found__actions { margin-top: 1.5rem; }
      .not-found__action { display: inline-flex; align-items: center; min-height: 44px; font-size: var(--type-body); }
      @media (max-width: 680px) {
        .not-found { padding: 5.5rem 12px 2rem; }
        .not-found__terrain { right: -70%; width: 160%; height: 90%; }
        .not-found__card { border-radius: var(--window-radius); }
      }
      @media (forced-colors: active), (prefers-contrast: more) {
        .not-found__terrain, .not-found__map { display: none; }
      }
