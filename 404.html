<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Точка не найдена — Антон Гороховатский</title>
    <meta
      name="description"
      content="Такого адреса на карте опыта Антона Гороховатского нет. Вернитесь на карту работ и интересов."
    >
    <meta name="author" content="Антон Гороховатский">
    <meta name="robots" content="noindex, follow">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#eeede7">
    <link rel="icon" href="/assets/favicon.png" type="image/png" sizes="64x64">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" sizes="180x180">
    <script>
      (() => {
        let savedThemeMode = null;

        try {
          savedThemeMode = window.localStorage.getItem("anton-signal-theme");
        } catch {
          savedThemeMode = null;
        }

        const themeMode = savedThemeMode === "light" || savedThemeMode === "dark"
          ? savedThemeMode
          : "system";
        const theme = themeMode === "system"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : themeMode;

        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themeMode = themeMode;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          theme === "dark" ? "#11120f" : "#eeede7",
        );
      })();
    </script>
    <link rel="preload" href="/assets/fonts/Akt-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/Rene-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/styles.css?v=66ea30074bb4">
    <style>
      html, body { min-height: 100%; }
      body { height: auto; overflow-y: auto; }
      .not-found {
        position: relative;
        isolation: isolate;
        display: flex;
        align-items: center;
        height: auto;
        min-height: 100svh;
        overflow: hidden;
        padding: clamp(24px, 8vw, 144px);
      }
      .not-found__map {
        position: absolute;
        z-index: -1;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 12.5vw 12.5vw;
        mask-image: radial-gradient(ellipse at 75% 50%, #000, transparent 80%);
      }
      .not-found__terrain {
        position: absolute;
        z-index: -1;
        top: 50%;
        right: -8%;
        width: min(88vw, 1260px);
        height: min(90svh, 800px);
        transform: translateY(-50%);
        pointer-events: none;
        mask-image: radial-gradient(ellipse at 65% 48%, #000 16%, transparent 70%);
      }
      .not-found__terrain::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--signal);
        opacity: .55;
        mask: url("/assets/atlas-terrain.svg") center / cover no-repeat;
      }
      .not-found__card {
        position: relative;
        width: min(100%, 36rem);
        padding: clamp(28px, 4vw, 56px);
        border-radius: 32px;
        corner-shape: var(--corner-card-shape);
        color: var(--content-ink);
      }
      .not-found__meta {
        display: flex;
        align-items: baseline;
        gap: 1rem;
        margin: 0 0 clamp(32px, 4vw, 56px);
        color: var(--content-muted);
      }
      .not-found__code {
        font: 400 2rem/1 var(--font-author);
        color: var(--content-ink);
      }
      .not-found__meta-label { font-size: .75rem; }
      .not-found__title {
        margin: 0;
        font-size: clamp(2rem, calc(1.5rem + 2.8vw), 4rem);
        font-weight: 500;
        line-height: 1.02;
        letter-spacing: -.04em;
      }
      .not-found__title-line { display: block; }
      .not-found__copy {
        max-width: 26rem;
        margin: 1.75rem 0 0;
        color: var(--content-muted);
        font-size: 1rem;
        line-height: 1.5;
        text-wrap: pretty;
      }
      .not-found__actions { margin-top: 2rem; }
      .not-found__action {
        display: inline-flex;
        align-items: center;
        gap: 1rem;
        min-height: 44px;
        color: var(--content-ink);
        font-size: .9375rem;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .not-found__action-arrow {
        position: relative;
        display: block;
        width: 20px;
        height: 20px;
      }
      .not-found__action-arrow::before {
        content: "";
        position: absolute;
        top: 9px;
        left: 0;
        width: 18px;
        border-top: 1px solid currentColor;
      }
      .not-found__action-arrow::after {
        content: "";
        position: absolute;
        top: 5px;
        right: 2px;
        width: 8px;
        height: 8px;
        border: solid currentColor;
        border-width: 1px 1px 0 0;
        transform: rotate(45deg);
      }
      .not-found__action:hover { color: var(--signal); }
      .not-found__action:focus-visible { outline: 2px solid var(--signal); outline-offset: 5px; }
      @media (max-width: 680px) {
        .not-found { padding: 24px 12px; }
        .not-found__terrain { right: -70%; width: 160%; height: 90%; }
        .not-found__card { padding: 32px 24px; border-radius: 24px; }
        .not-found__meta { flex-wrap: wrap; gap: .75rem; }
        .not-found__copy { font-size: .9375rem; }
      }
      @media (forced-colors: active), (prefers-contrast: more) {
        .not-found__terrain, .not-found__map { display: none; }
      }
    </style>
  </head>
  <body>
    <main class="not-found" id="content">
      <div class="not-found__map" aria-hidden="true"></div>
      <div class="not-found__terrain" aria-hidden="true"></div>

      <section
        class="not-found__card"
        data-material-surface="page-404"
        data-material-active="always"
        aria-labelledby="not-found-title"
      >
        <p class="not-found__meta">
          <span class="not-found__code">404</span>
          <span class="not-found__meta-label">Неизвестный участок</span>
        </p>
        <h1 class="not-found__title" id="not-found-title">
          <span class="not-found__title-line">Точка</span>
          <span class="not-found__title-line">не найдена</span>
        </h1>
        <p class="not-found__copy">
          Такого адреса на&nbsp;карте нет. Возможно, ссылка устарела
          или в&nbsp;ней опечатка.
        </p>
        <nav class="not-found__actions" aria-label="Дальнейшее действие">
          <a class="not-found__action" href="/#map">
            <span>Вернуться на&nbsp;карту</span>
            <span class="not-found__action-arrow" aria-hidden="true"></span>
          </a>
        </nav>
      </section>
    </main>
  </body>
</html>
