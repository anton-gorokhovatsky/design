<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520">
  <title>Музей глазами посетителя</title>
  <desc>Подход к исследованию сенсорной карты Музея «Гараж»: где будет тише, насколько яркий свет, где можно передохнуть? Задача — помочь человеку подготовиться к визиту и выбрать комфортный маршрут.</desc>
  <rect width="640" height="520" fill="#f7f6f2"/>
  <g font-family="Arial, sans-serif" fill="#292925">
    <text x="32" y="44" font-size="21" fill="#65655f">МУЗЕЙ «ГАРАЖ»</text>
    <text x="32" y="94" font-size="35" font-weight="600">Музей глазами посетителя</text>
    <text x="32" y="128" font-size="21" fill="#65655f">К исследованию сенсорной карты</text>
    <g fill="none" stroke="#65655f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M34 209h7l10-9v28l-10-9h-7z M57 204a16 16 0 0 1 0 20 M63 198a24 24 0 0 1 0 32"/>
      <circle cx="51" cy="286" r="10"/>
      <path d="M51 265v-5 M51 307v5 M30 286h-5 M72 286h5 M36 271l-4-4 M66 301l4 4 M36 301l-4 4 M66 271l4-4"/>
      <path d="M34 347h34v13H34z M31 365h40 M37 365v13 M65 365v13"/>
    </g>
    <g font-size="28">
      <text x="96" y="223">Где будет тише?</text>
      <text x="96" y="295">Насколько яркий свет?</text>
      <text x="96" y="367">Где можно передохнуть?</text>
    </g>
    <path d="M32 414H608" stroke="#d4d4cd"/>
    <text x="32" y="455" font-size="27">Помочь подготовиться к визиту</text>
    <text x="32" y="490" font-size="27">и выбрать комфортный маршрут.</text>
  </g>
</svg>
