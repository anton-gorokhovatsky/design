<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520">
  <title>Сенсорная карта 2.0 — фрагмент исследовательской таблицы</title>
  <desc>Музей «Гараж». Лекторий: звук — умеренно, громко; свет — темно, нормально; пространство — закрытое, тесно; скопление людей — высокий уровень. ОЦ-5, библиотека: звук — тихо; свет — нормально; пространство — закрытое, просторно; скопление людей — средний уровень.</desc>
  <rect width="640" height="520" fill="#f7f6f2"/>
  <g font-family="Arial, sans-serif" fill="#292925">
    <text x="32" y="44" font-size="19" fill="#65655f">ИССЛЕДОВАНИЕ · МУЗЕЙ «ГАРАЖ»</text>
    <text x="32" y="91" font-size="34" font-weight="600">Сенсорная карта 2.0</text>
    <g stroke="#d4d4cd" stroke-width="1">
      <path d="M32 118H608 M32 186H608 M32 258H608 M32 330H608 M32 402H608 M32 460H608"/>
      <path d="M180 118V460 M404 118V460"/>
    </g>
    <g font-size="23" fill="#65655f">
      <text x="32" y="156">Свойство</text>
      <text x="32" y="226">Звук</text>
      <text x="32" y="298">Свет</text>
      <text x="32" y="370" font-size="21">Пространство</text>
      <text x="32" y="426">Люди /<tspan x="32" dy="24" font-size="19">уровень</tspan></text>
    </g>
    <g font-size="24" font-weight="600">
      <text x="200" y="156">Лекторий</text>
      <text x="424" y="147">ОЦ-5 /<tspan x="424" dy="27">библиотека</tspan></text>
    </g>
    <g font-size="25">
      <text x="200" y="217">Умеренно,<tspan x="200" dy="29">громко</tspan></text>
      <text x="424" y="226">Тихо</text>
      <text x="200" y="289">Темно,<tspan x="200" dy="29">нормально</tspan></text>
      <text x="424" y="298">Нормально</text>
      <text x="200" y="361">Закрытое,<tspan x="200" dy="29">тесно</tspan></text>
      <text x="424" y="361">Закрытое,<tspan x="424" dy="29">просторно</tspan></text>
      <text x="200" y="438">Высокий</text>
      <text x="424" y="438">Средний</text>
    </g>
    <text x="32" y="495" font-size="19" fill="#65655f">Фрагмент таблицы «Пространства и свойства» в Notion</text>
  </g>
</svg>
