<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .stream {
      fill: none;
      stroke: #315dff;
      stroke-linecap: square;
      stroke-linejoin: bevel;
      animation: flow 5.8s linear infinite;
    }

    .stream--base {
      stroke-width: 2.1;
      opacity: .62;
      animation: none;
    }

    .stream--core {
      stroke-width: 3.8;
      stroke-dasharray: 3.2 2.6;
      opacity: 1;
    }

    .stream--counter {
      stroke-width: 2;
      stroke-dasharray: 1.2 4.2;
      opacity: .72;
      animation-direction: reverse;
    }

    .particle {
      fill: #315dff;
      stroke: #315dff;
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 4.2s steps(2, jump-none) infinite;
    }

    .particle--2 { animation-delay: -1.4s; }
    .particle--3 { animation-delay: -2.8s; }

    @keyframes flow {
      to { stroke-dashoffset: -18; }
    }

    @keyframes twinkle {
      0%, 100% { opacity: .72; transform: scale(.9); }
      50% { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stream,
      .particle {
        animation: none;
      }
    }
  </style>

  <path class="stream stream--base" d="M3 56C15 17 43 7 61 35"/>
  <path class="stream stream--core" d="M3 56C15 17 43 7 61 35"/>
  <path class="stream stream--counter" d="M3 56C15 17 43 7 61 35"/>

  <g class="particle">
    <rect x="7" y="40" width="4" height="4"/>
    <rect x="24" y="17" width="4" height="4"/>
    <rect x="46" y="17" width="4" height="4"/>
    <rect x="56" y="30" width="4" height="4"/>
  </g>

  <path class="particle particle--3" d="M12 30h7M15.5 26.5v7" fill="none" stroke-width="2.4"/>
  <path class="particle particle--2" d="M29 17h9M33.5 12.5v9" fill="none" stroke-width="2.6"/>
  <path class="particle" d="M40 17h7M43.5 13.5v7" fill="none" stroke-width="2.4"/>
  <path class="particle particle--2" d="M51 23h6M54 20v6" fill="none" stroke-width="2.2"/>
  <rect class="particle particle--3" x="4" y="57" width="3" height="3"/>
  <rect class="particle particle--2" x="57" y="40" width="3" height="3"/>
</svg>
