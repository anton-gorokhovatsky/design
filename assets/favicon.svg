<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .galaxy {
      transform-box: view-box;
      transform-origin: 32px 32px;
      animation: drift 9s ease-in-out infinite alternate;
    }

    .arm {
      fill: none;
      stroke: #315dff;
      stroke-linecap: square;
      stroke-width: 5;
      stroke-dasharray: 3.4 2.6;
      opacity: .98;
      animation: flow 7s linear infinite;
    }

    .arm--quiet {
      stroke-width: 3.4;
      stroke-dasharray: 2.2 3.2;
      opacity: .68;
      animation-direction: reverse;
    }

    .particle {
      fill: #315dff;
      animation: twinkle 4.8s steps(2, jump-none) infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .particle--2 {
      animation-delay: -1.6s;
    }

    .particle--3 {
      animation-delay: -3.2s;
    }

    @keyframes drift {
      from { transform: rotate(-13deg) translate(-.35px, .25px); }
      to { transform: rotate(-9deg) translate(.35px, -.25px); }
    }

    @keyframes flow {
      to { stroke-dashoffset: -24; }
    }

    @keyframes twinkle {
      0%, 100% { opacity: .36; transform: scale(.82); }
      50% { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .galaxy,
      .arm,
      .particle {
        animation: none;
      }
    }
  </style>

  <g transform="translate(32 32) scale(1.16 1.48) translate(-32 -32)">
    <g class="galaxy" transform="rotate(-11 32 32)">
      <path class="arm" d="M31 31C38 24 48 27 51 34C54 41 48 49 39 50"/>
      <path class="arm" d="M33 33C26 40 16 38 13 31C10 24 16 16 25 15"/>
      <path class="arm arm--quiet" d="M30 29C25 24 18 24 14 28"/>
      <path class="arm arm--quiet" d="M34 35C39 40 47 40 52 36"/>

      <g class="particle">
        <rect x="28" y="28" width="4" height="4"/>
        <rect x="33" y="32" width="5" height="5"/>
        <rect x="27" y="35" width="3" height="3"/>
        <path d="M34 26h2v3h3v2h-3v3h-2v-3h-3v-2h3z"/>
      </g>

      <g class="particle particle--2">
        <rect x="42" y="27" width="3" height="3"/>
        <rect x="47" y="34" width="2" height="2"/>
        <path d="M43 42h2v2h2v2h-2v2h-2v-2h-2v-2h2z"/>
        <path d="M52 41h2v5h-2zM50.5 42.5h5v2h-5z"/>
      </g>

      <g class="particle particle--3">
        <rect x="18" y="31" width="3" height="3"/>
        <rect x="22" y="18" width="2" height="2"/>
        <path d="M20 24h2v2h2v2h-2v2h-2v-2h-2v-2h2z"/>
        <path d="M12 27h2v5h-2zM10.5 28.5h5v2h-5z"/>
        <rect x="25" y="40" width="2" height="2"/>
      </g>

      <rect class="particle particle--2" x="7" y="20" width="2" height="2"/>
      <rect class="particle" x="55" y="31" width="2" height="2"/>
      <rect class="particle particle--3" x="38" y="53" width="2" height="2"/>
    </g>
  </g>
</svg>
