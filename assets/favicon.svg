<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .galaxy {
      transform-box: view-box;
      transform-origin: 32px 32px;
      animation: drift 9s ease-in-out infinite alternate;
    }

    .arm {
      fill: none;
      stroke: #315dff;
      stroke-linecap: square;
      stroke-linejoin: bevel;
      stroke-width: 4.8;
      opacity: 1;
    }

    .particle {
      fill: #315dff;
      animation: twinkle 4.8s steps(2, jump-none) infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .particle--2 {
      animation-delay: -1.6s;
    }

    .particle--3 {
      animation-delay: -3.2s;
    }

    @keyframes drift {
      from { transform: rotate(-21deg) translate(-.35px, .25px); }
      to { transform: rotate(-17deg) translate(.35px, -.25px); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: .36; transform: scale(.82); }
      50% { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .galaxy,
      .particle {
        animation: none;
      }
    }
  </style>

  <g class="galaxy" transform="rotate(-19 32 32)">
    <path
      class="arm"
      d="M33.5 30.9L34.9 30.7L36.3 31.1L37.6 31.9L38.7 33.2L39.3 34.9L39.4 36.8L38.7 38.9L37.3 40.9L35.1 42.7L32.3 44.1L28.9 44.9L25.1 44.9L21.2 44.1L17.4 42.3L14 39.8L11.3 36.3L9.5 32.3L8.8 27.7L9.4 22.9L11.4 18.2L14.7 13.8L19.3 10L25.1 7.1L31.7 5.3"
    />
    <path
      class="arm"
      d="M30.5 33.1L29.1 33.3L27.7 32.9L26.4 32.1L25.3 30.8L24.7 29.1L24.6 27.2L25.3 25.1L26.7 23.1L28.9 21.3L31.7 19.9L35.1 19.1L38.9 19.1L42.8 19.9L46.6 21.7L50 24.2L52.7 27.7L54.5 31.7L55.2 36.3L54.6 41.1L52.6 45.8L49.3 50.2L44.7 54L38.9 56.9L32.3 58.7"
    />

    <g class="particle">
      <rect x="29" y="29" width="6" height="6"/>
      <rect x="4" y="13" width="3" height="3"/>
      <rect x="54" y="7" width="4" height="4"/>
    </g>

    <g class="particle particle--2">
      <rect x="58" y="46" width="3" height="3"/>
      <rect x="11" y="52" width="3" height="3"/>
    </g>

    <g class="particle particle--3">
      <rect x="17" y="3" width="3" height="3"/>
      <rect x="44" y="59" width="3" height="3"/>
    </g>
  </g>
</svg>
