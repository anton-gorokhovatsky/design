<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .galaxy {
      transform-box: view-box;
      transform-origin: 32px 32px;
      animation: galaxy-drift 12s ease-in-out infinite alternate;
    }

    .stream {
      fill: none;
      stroke: #315dff;
      stroke-linecap: round;
      animation: stream-flow 8s linear infinite;
    }

    .stream--wide {
      stroke-width: 2.4;
      stroke-dasharray: 1.2 4;
      opacity: 0.44;
    }

    .stream--core {
      stroke-width: 3.4;
      stroke-dasharray: 3.2 3;
      opacity: 0.96;
    }

    .stream--counter {
      stroke-width: 1.6;
      stroke-dasharray: 1 5;
      opacity: 0.36;
      animation-direction: reverse;
    }

    .nucleus {
      transform-box: fill-box;
      transform-origin: center;
      animation: nucleus-pulse 3.6s ease-in-out infinite;
    }

    .twinkle {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 4.8s steps(2, jump-none) infinite;
    }

    .twinkle--2 {
      animation-delay: -1.6s;
    }

    .twinkle--3 {
      animation-delay: -3.2s;
    }

    .micro {
      display: none;
    }

    .micro-stream--core {
      animation-duration: 5.2s;
    }

    .micro-stream--counter {
      animation-duration: 6.4s;
      animation-direction: reverse;
    }

    @keyframes galaxy-drift {
      from {
        transform: translate(-0.8px, 0.35px) rotate(-1.2deg);
      }

      to {
        transform: translate(0.8px, -0.35px) rotate(1.2deg);
      }
    }

    @keyframes stream-flow {
      to {
        stroke-dashoffset: -21;
      }
    }

    @keyframes nucleus-pulse {
      0%,
      100% {
        opacity: 0.82;
        transform: scale(0.92);
      }

      48% {
        opacity: 1;
        transform: scale(1.08);
      }
    }

    @keyframes twinkle {
      0%,
      34%,
      100% {
        opacity: 0.92;
        transform: scale(1);
      }

      62% {
        opacity: 0.28;
        transform: scale(0.68);
      }
    }

    @media (max-width: 20px) {
      .galaxy-scene {
        display: none;
      }

      .micro {
        display: block;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .galaxy,
      .stream,
      .nucleus,
      .twinkle {
        animation: none;
      }
    }
  </style>

  <!-- A tilted ASCII Milky Way: two moving signal streams and a dense core. -->
  <g class="galaxy-scene">
    <g class="galaxy">
      <path class="stream stream--wide" d="M3 46C14 22 44 13 61 30"/>
      <path class="stream stream--core" d="M5 49C17 27 44 20 60 33"/>
      <path class="stream stream--counter" d="M8 40C20 21 43 18 57 28"/>

      <g
        class="dust dust--outer"
        fill="#87a0ff"
        opacity="0.74"
      >
        <circle class="twinkle" cx="8" cy="40" r="1.5"/>
        <circle class="twinkle twinkle--2" cx="17" cy="29" r="1.1"/>
        <circle class="twinkle twinkle--3" cx="48" cy="24" r="1.3"/>
        <circle class="twinkle twinkle--2" cx="57" cy="30" r="1.5"/>
        <rect class="twinkle twinkle--3" x="42" y="21" width="2.4" height="2.4"/>
      </g>

      <g fill="#315dff">
        <rect class="twinkle twinkle--2" x="7" y="39" width="4" height="4"/>
        <rect class="twinkle" x="15" y="29" width="3.5" height="3.5"/>
        <rect class="twinkle twinkle--3" x="23" y="23" width="4.5" height="4.5"/>
        <rect class="twinkle twinkle--2" x="32" y="20" width="5" height="5"/>
        <rect class="twinkle" x="41" y="21" width="4" height="4"/>
        <rect class="twinkle twinkle--3" x="49" y="24" width="4.5" height="4.5"/>
        <rect class="twinkle twinkle--2" x="56" y="28" width="3.5" height="3.5"/>
      </g>

      <!-- Literal ASCII-like + and × marks make the band legible as signal. -->
      <g fill="none" stroke="#315dff" stroke-linecap="square">
        <path
          class="twinkle"
          d="M11 33h7M14.5 29.5v7"
          stroke-width="2.1"
        />
        <path
          class="twinkle twinkle--2"
          d="m24 21 5 5m0-5-5 5"
          stroke-width="2"
        />
        <path
          class="twinkle twinkle--3"
          d="M43 22h7M46.5 18.5v7"
          stroke-width="2.1"
        />
        <path
          class="dust--outer twinkle twinkle--2"
          d="m52 27 5 5m0-5-5 5"
          stroke-width="1.8"
        />
      </g>

      <g class="nucleus" transform="translate(34 21)">
        <circle r="5.2" fill="#315dff" opacity="0.18"/>
        <circle r="2.8" fill="#315dff"/>
        <path
          d="M-8 0h16M0-8v16"
          fill="none"
          stroke="#315dff"
          stroke-linecap="square"
          stroke-width="2.2"
        />
      </g>
    </g>
  </g>

  <!-- A denser optical cut preserves the same cosmic silhouette at 16 px. -->
  <g class="micro">
    <path
      class="stream micro-stream--core"
      d="M4 48C16 24 44 17 61 31"
      fill="none"
      stroke="#315dff"
      stroke-dasharray="8 4"
      stroke-linecap="square"
      stroke-width="6.4"
    />
    <path
      class="stream micro-stream--counter"
      d="M7 40C20 23 43 19 58 29"
      fill="none"
      stroke="#315dff"
      stroke-dasharray="2 5"
      stroke-linecap="square"
      stroke-width="2.8"
      opacity="0.68"
    />
    <g class="nucleus" transform="translate(34 21)">
      <circle r="6.5" fill="#315dff" opacity="0.2"/>
      <circle r="3.4" fill="#315dff"/>
      <path
        d="M-8 0h16M0-8v16"
        fill="none"
        stroke="#315dff"
        stroke-linecap="square"
        stroke-width="3"
      />
    </g>
    <rect class="twinkle" x="12" y="32" width="4" height="4" fill="#315dff"/>
    <rect class="twinkle twinkle--2" x="52" y="27" width="4" height="4" fill="#315dff"/>
  </g>
</svg>
