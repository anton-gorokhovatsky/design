<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .signal {
      transform-box: fill-box;
      transform-origin: center;
      animation: signal 4.8s steps(2, jump-none) infinite;
    }

    .signal--2 {
      animation-delay: -1.6s;
    }

    .signal--3 {
      animation-delay: -3.2s;
    }

    .micro {
      display: none;
    }

    @keyframes signal {
      0%,
      28%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      54% {
        opacity: 0.24;
        transform: scale(0.66);
      }
    }

    @media (max-width: 20px) {
      .matrix {
        display: none;
      }

      .micro {
        display: block;
      }

      .detail {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .signal {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>

  <!-- At 16 px a filled optical cut replaces the matrix gaps. -->
  <g class="micro" fill="#315dff">
    <path fill-rule="evenodd" d="
      M2 56 15 8h10l13 48h-9l-3-12H14l-3 12H2Zm14-20h8l-4-17-4 17Z
    "/>
    <path d="M39 8h23v9H48v39h-9V8Z"/>
  </g>

  <!-- A compact 4×7 ASCII matrix keeps both letters legible at 16 px. -->
  <g class="matrix" fill="#315dff">
    <!-- А -->
    <path d="
      M10 11h5v5h-5z M16 11h5v5h-5z
      M4 17h5v5H4z M22 17h5v5h-5z
      M4 23h5v5H4z M22 23h5v5h-5z
      M4 29h5v5H4z M10 29h5v5h-5z M16 29h5v5h-5z M22 29h5v5h-5z
      M4 35h5v5H4z M22 35h5v5h-5z
      M4 41h5v5H4z M22 41h5v5h-5z
      M4 47h5v5H4z M22 47h5v5h-5z
    "/>

    <!-- Г -->
    <path d="
      M34 11h5v5h-5z M40 11h5v5h-5z M46 11h5v5h-5z M52 11h5v5h-5z
      M34 17h5v5h-5z
      M34 23h5v5h-5z
      M34 29h5v5h-5z
      M34 35h5v5h-5z
      M34 41h5v5h-5z
      M34 47h5v5h-5z
    "/>
  </g>

  <!-- Detached map signals appear only when the renderer has enough pixels. -->
  <g class="detail" fill="#87a0ff">
    <circle class="signal" cx="29.5" cy="8" r="2"/>
    <circle class="signal signal--2" cx="58.5" cy="27" r="1.75"/>
    <circle class="signal signal--3" cx="29.5" cy="55" r="1.75"/>
  </g>
</svg>
