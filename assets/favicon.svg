<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .stream {
      fill: none;
      stroke: #315dff;
      stroke-linecap: square;
      stroke-linejoin: bevel;
      animation: flow 3.8s linear infinite;
    }

    .stream--base {
      stroke-width: 1.6;
      opacity: .46;
      animation: none;
    }

    .stream--core {
      stroke-width: 3.4;
      stroke-dasharray: 3.2 3;
      opacity: .98;
    }

    .stream--counter {
      stroke-width: 1.8;
      stroke-dasharray: 1.2 4.6;
      opacity: .58;
      animation-direction: reverse;
    }

    .particle {
      fill: #315dff;
      stroke: #315dff;
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 4.2s steps(2, jump-none) infinite;
    }

    .particle--2 {
      animation-delay: -1.4s;
    }

    .particle--3 {
      animation-delay: -2.8s;
    }

    @keyframes flow {
      to { stroke-dashoffset: -18; }
    }

    @keyframes twinkle {
      0%, 100% { opacity: .58; transform: scale(.86); }
      50% { opacity: .98; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stream,
      .particle {
        animation: none;
      }
    }
  </style>

  <path class="stream stream--base" d="M3 56C15 17 43 7 61 35"/>
  <path class="stream stream--core" d="M3 56C15 17 43 7 61 35"/>
  <path class="stream stream--counter" d="M3 56C15 17 43 7 61 35"/>

  <g class="particle">
    <rect x="7" y="40" width="3" height="3"/>
    <rect x="24" y="17" width="4" height="4"/>
    <rect x="46" y="17" width="4" height="4"/>
    <rect x="57" y="30" width="3" height="3"/>
  </g>

  <path
    class="particle particle--3"
    d="M15 27h6M18 24v6"
    fill="none"
    stroke-width="2.2"
  />
  <path
    class="particle particle--2"
    d="M30 17h8M34 13v8"
    fill="none"
    stroke-width="2.4"
  />
  <path
    class="particle"
    d="M41 17h6M44 14v6"
    fill="none"
    stroke-width="2.2"
  />
  <rect class="particle particle--3" x="4" y="57" width="3" height="3"/>
  <rect class="particle particle--2" x="57" y="40" width="3" height="3"/>
</svg>
